[package]
name = "tree-sitter-swi-prolog"
description = "SWI-Prolog grammar for tree-sitter"
version = "0.1.1"
authors = ["Piotr Franczyk"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "swi-prolog"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/Looted/tree-sitter-swi-prolog"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.7"
