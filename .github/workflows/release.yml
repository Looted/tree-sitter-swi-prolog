name: Release

# Publishes the version in package.json. To release:
#
#   1. In a pull request, bump the version in package.json, package-lock.json,
#      tree-sitter.json, Cargo.toml and pyproject.toml (`npx tree-sitter
#      version X.Y.Z` then `npm install --package-lock-only`) and add a
#      '## X.Y.Z' section to CHANGELOG.md. CI checks that they agree.
#   2. Merge it, then run this workflow on main from the Actions tab.
#
# The workflow refuses a version whose tag already exists, creates the vX.Y.Z
# tag and GitHub release (notes from CHANGELOG.md, with the Wasm parser and
# the full source tarball attached) on the commit it checked, and publishes
# that commit to npm, crates.io and PyPI.
#
# A vX.Y.Z tag pushed by hand runs the same checks and publish steps.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  github:
    name: Check, tag and create the GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check the version and changelog
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(scripts/release-check.sh --tag "$GITHUB_REF_NAME")
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "Run the release from main, not $GITHUB_REF_NAME." >&2
              exit 1
            fi
            version=$(scripts/release-check.sh --untagged)
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Build the Wasm parser and source tarball
        run: |
          tree-sitter build --wasm
          git ls-files > "$RUNNER_TEMP/files"
          tar czf tree-sitter-swi-prolog.tar.gz -T "$RUNNER_TEMP/files"

      - name: Generate attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            *.wasm
            tree-sitter-swi-prolog.tar.gz

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A release made by hand in the web UI: attach the files and fill in empty notes.
            gh release upload "$TAG" *.wasm tree-sitter-swi-prolog.tar.gz --clobber
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          else
            gh release create "$TAG" *.wasm tree-sitter-swi-prolog.tar.gz \
              --target "$GITHUB_SHA" --title "tree-sitter-swi-prolog ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

  npm:
    needs: github
    uses: tree-sitter/workflows/.github/workflows/package-npm.yml@main
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  crates:
    needs: github
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@main
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  pypi:
    needs: github
    uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@main
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
