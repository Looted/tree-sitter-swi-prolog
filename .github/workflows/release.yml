name: Release

# Every push to main runs this workflow (it can also be run by hand from the
# Actions tab):
#
#   - While .changeset/ holds changesets, it opens or updates the "Version
#     packages" pull request, which applies them: it bumps the version in
#     every manifest and moves their text into CHANGELOG.md.
#   - Once that pull request is merged (no changesets left), it releases the
#     version in package.json everywhere it is still missing: the vX.Y.Z tag
#     and GitHub release (notes from CHANGELOG.md, with the Wasm parser and
#     the source tarball attached), npm, crates.io and PyPI.
#
# Each target is checked separately, so a run that failed half-way is fixed
# by running the workflow again. Don't create tags or releases by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Open the version pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --omit optional

      - name: Create or update the pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ github.token }}

  plan:
    name: Find what is not released yet
    needs: version
    if: needs.version.outputs.pending == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      github: ${{ steps.plan.outputs.github }}
      npm: ${{ steps.plan.outputs.npm }}
      crates: ${{ steps.plan.outputs.crates }}
      pypi: ${{ steps.plan.outputs.pypi }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check each target
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(scripts/release-check.sh)
          name=$(node -p "require('./package.json').name")
          missing() { if "$@" > /dev/null 2>&1; then echo false; else echo true; fi; }
          {
            echo "version=$version"
            echo "github=$(missing gh release view "v$version")"
            echo "npm=$(missing npm view "$name@$version" version --json)"
            echo "crates=$(missing curl -fsS -A "$GITHUB_REPOSITORY release workflow" \
              "https://crates.io/api/v1/crates/$name/$version")"
            echo "pypi=$(missing curl -fsS "https://pypi.org/pypi/$name/$version/json")"
          } | tee -a "$GITHUB_OUTPUT"

  github:
    name: Tag and create the GitHub release
    needs: plan
    if: needs.plan.outputs.github == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Build the Wasm parser and source tarball
        run: |
          tree-sitter build --wasm
          git ls-files > "$RUNNER_TEMP/files"
          tar czf tree-sitter-swi-prolog.tar.gz -T "$RUNNER_TEMP/files"

      - name: Generate attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            *.wasm
            tree-sitter-swi-prolog.tar.gz

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" *.wasm tree-sitter-swi-prolog.tar.gz \
            --target "$GITHUB_SHA" --title "tree-sitter-swi-prolog $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

  npm_build:
    name: Build NodeJS binaries on ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.npm == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        # No windows-11-arm: node-gyp cannot find the Visual Studio 2026 build
        # tools on that image. Windows on Arm installs build from source.
        os:
          - windows-2022
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --omit optional

      - name: Build binary
        run: npx prebuildify -t 20.19.5

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          path: prebuilds/**
          name: prebuilds-${{ matrix.os }}
          retention-days: 2

  npm:
    name: Publish to npm
    needs: [plan, npm_build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/tree-sitter-swi-prolog
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Build the Wasm parser
        run: tree-sitter build --wasm

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: prebuilds
          pattern: prebuilds-*
          merge-multiple: true

      - name: Check the package
        run: |
          find prebuilds -type f | sort
          npm pack --dry-run

      - name: Publish
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  crates:
    needs: plan
    if: needs.plan.outputs.crates == 'true'
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@main
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  pypi:
    needs: plan
    if: needs.plan.outputs.pypi == 'true'
    uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@main
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
